services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters
      
  payment_gateway:
    build: .
    container_name: payment_gateway
    ports:
      - "8090:8080"   # host 8090: the simulator keeps 8080 and 2525
    environment:
      AcquiringBank__BaseUrl: http://bank_simulator:8080
      Swagger__Enabled: "true"
    depends_on:
      - bank_simulator
