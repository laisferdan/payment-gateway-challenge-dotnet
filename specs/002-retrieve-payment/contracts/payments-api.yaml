openapi: 3.0.3
info:
  title: Payment Gateway API – retrieval (UC2)
  version: 1.0.0
  description: >
    Lets a merchant retrieve a previously made payment by its id (UC2). This design contract
    covers only the retrieval operation and reuses the schemas of the processing contract
    (UC1, ../../001-process-payment/contracts/payments-api.yaml) by reference. The OpenAPI
    document generated by the gateway describes both operations. The full card number and CVV
    are never returned; only the last four card digits are exposed.
paths:
  /api/payments/{id}:
    get:
      operationId: RetrievePayment
      summary: Retrieve a payment's details
      description: >
        Returns a payment that was Authorized or Declined, with exactly the same fields and
        values as the processing response. Requests that were Rejected or failed at the bank
        were never recorded and are not found. Retrieval has no side effects and never contacts
        the acquiring bank. Payments are kept in memory and are not found after the gateway
        restarts. There is no merchant ownership check (authentication is out of scope).
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The payment id returned when the payment was processed. Any GUID notation is
            accepted – canonical (8-4-4-4-12), 32 digits without hyphens, in braces {…}, in
            parentheses (…), or the hexadecimal {0x…} form – in any letter case; surrounding
            whitespace is ignored. Any other value is refused with 400.
          schema:
            type: string
            format: uuid
          examples:
            canonical:
              value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            uppercaseBraces:
              value: '{3FA85F64-5717-4562-B3FC-2C963F66AFA6}'
      responses:
        '200':
          description: >
            The payment. `id` is always returned in canonical lowercase form, whatever form was
            used in the request.
          content:
            application/json:
              schema:
                $ref: '../../001-process-payment/contracts/payments-api.yaml#/components/schemas/PaymentResponse'
              examples:
                authorized:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    status: Authorized
                    cardNumberLastFour: "8877"
                    expiryMonth: 4
                    expiryYear: 2027
                    currency: GBP
                    amount: 100
                declinedLeadingZeros:
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    status: Declined
                    cardNumberLastFour: "0012"
                    expiryMonth: 12
                    expiryYear: 2030
                    currency: EUR
                    amount: 1050
        '400':
          description: >
            Invalid payment id – the value is not a GUID in any accepted form. No payment was
            looked up. Unlike the processing 400, there is no `paymentStatus`, because no
            payment was attempted. The submitted value is never echoed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidPaymentIdProblemDetails'
              examples:
                invalidId:
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: Invalid payment id
                    status: 400
                    errors:
                      id: ["The payment id must be a GUID, e.g. 3fa85f64-5717-4562-b3fc-2c963f66afa6."]
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '404':
          description: >
            Payment not found – no Authorized or Declined payment has this id. The response is
            the same for every unknown id and does not reveal whether the id ever existed.
          content:
            application/problem+json:
              schema:
                $ref: '../../001-process-payment/contracts/payments-api.yaml#/components/schemas/ProblemDetails'
              examples:
                notFound:
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                    title: Payment not found
                    status: 404
                    detail: No payment exists with the given id.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '500':
          description: Unexpected error. No details are disclosed.
          content:
            application/problem+json:
              schema:
                $ref: '../../001-process-payment/contracts/payments-api.yaml#/components/schemas/ProblemDetails'
  /api/payments:
    get:
      operationId: RetrievePaymentWithoutId
      summary: Not supported – an id is required
      description: >
        Documents the empty-id case only. There is no list endpoint; `GET` on the collection
        (including a trailing slash with no id) is answered by routing with 405, returned as a
        ProblemDetails with traceId like every error of the service (UC1 contract, "Errors").
      responses:
        '405':
          $ref: '../../001-process-payment/contracts/payments-api.yaml#/components/responses/RoutingProblem'
components:
  schemas:
    InvalidPaymentIdProblemDetails:
      allOf:
        - $ref: '../../001-process-payment/contracts/payments-api.yaml#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Always a single entry, `id`, with a fixed message.
              required: [id]
              properties:
                id:
                  type: array
                  items:
                    type: string
              additionalProperties: false
